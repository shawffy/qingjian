```yaml
name: Android ARM64 APK

on:
  push:
    branches:
      - android-ime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust engine for ARM64
        run: |
          cargo ndk \
            -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build --release \
            --manifest-path android/rust/Cargo.toml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/qingjian-release.jks"
          test -s "$RUNNER_TEMP/qingjian-release.jks"

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/qingjian-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: qingjian-android-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
```
